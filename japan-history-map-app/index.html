<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本史マップ 1600-現在</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>日本史マップ <span class="header-sub">1600年 〜 現在</span></h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="map">地図で見る年表</button>
      <button class="tab-btn" data-tab="quiz">クイズで復習</button>
    </nav>
  </header>

  <main>
    <section id="view-map" class="view active">
      <div class="controls">
        <div class="control-group">
          <div class="era-buttons" id="eraButtons"></div>
          <div class="year-range">
            <input type="range" id="yearFrom" min="1600" max="2026" value="1600" step="1" />
            <input type="range" id="yearTo" min="1600" max="2026" value="2026" step="1" />
            <span id="yearRangeLabel" class="year-range-label"></span>
          </div>
        </div>
        <div class="cat-filters" id="catFilters"></div>
      </div>

      <div class="map-area">
        <svg id="japanMap" class="japan-map" role="img" aria-label="日本地図と出来事のピン"></svg>
        <aside id="detailPanel" class="detail-panel"></aside>
      </div>

      <div class="event-list-wrap">
        <h2>この期間の出来事 <span class="count-badge">(<span id="listCount"></span>件)</span></h2>
        <ul id="eventList" class="event-list"></ul>
      </div>
    </section>

    <section id="view-quiz" class="view"></section>
  </main>

  <footer class="app-footer">
    <p>出来事の内容・用語は、文部科学省 学習指導要領(中学校社会・歴史的分野/高校 歴史総合・日本史探求)で扱われる標準的な範囲に沿って作成しています。学習用の簡易データです。</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
